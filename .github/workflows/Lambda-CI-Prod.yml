name: Deploy the Lambda package to Dev

on:
 push: 
    branches:
      - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v4
            
            - name: setup Python
              uses: actions/setup-python@v6
              with:
                python-version: 'pypy3.11' 
            
            - name: Install pylint
              run: |
                python -m pip install --upgrade pip
                pip install pylint boto3

            - name: Linting Test
              run: python -m pylint Backend
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::955967371588:role/GithubActions-Lambda
                aws-region: us-east-1
              
            - name: Deploy Lambda Function
              uses: aws-actions/aws-lambda-deploy@v1
              with:
                function-name: prodloginredirect
                code-artifacts-dir: Backend
                handler: login_redirect.lambda_handler
                runtime: python3.11