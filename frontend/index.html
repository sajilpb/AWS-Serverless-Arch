<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Simple EC2 Control</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 2rem auto; }
      button { margin-right: 0.5rem; }
      pre { background: #f6f8fa; padding: 0.75rem; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>EC2 Control</h1>
    <div id="auth">
      <button id="login">Login</button>
      <button id="logout" style="display:none">Logout</button>
    </div>

    <div id="actions" style="display:none">
      <button id="create">Create EC2 Instance</button>
      <button id="delete">Delete My Instances</button>
    </div>

    <pre id="out"></pre>

    <script>
    // API base URL (no Cognito details stored here)
    // Replace the value below with your API Gateway endpoint (terraform output `api_base_url`).
    // Example: 'https://riya5bdsrc.execute-api.us-east-1.amazonaws.com'
    const API_BASE = 'https://riya5bdsrc.execute-api.us-east-1.amazonaws.com';

    function getApiBaseOrNull() {
      if (!API_BASE || API_BASE === 'REPLACE_WITH_API_BASE') return null;
      try {
        const u = new URL(API_BASE);
        if (u.protocol !== 'https:') return null;
        // Normalize: no trailing slash
        return u.origin;
      } catch {
        return null;
      }
    }

    function parseTokenFromHash() {
      if (location.hash && location.hash.startsWith('#')) {
        const h = new URLSearchParams(location.hash.substring(1));
        const token = h.get('access_token');
        if (token) {
          localStorage.setItem('access_token', token);
          // clear hash for cleanliness
          history.replaceState({}, document.title, location.pathname + location.search);
        }
      }
      return localStorage.getItem('access_token');
    }

    async function api(path, options={}) {
      const token = localStorage.getItem('access_token');
      if (!token) throw new Error('Not authenticated');
      const apiBase = getApiBaseOrNull();
      if (!apiBase) throw new Error('API not configured');
      const res = await fetch(`${apiBase}${path}`, {
        ...options,
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { raw: text }; }
      return { status: res.status, data };
    }

    const out = document.getElementById('out');
    const loginBtn = document.getElementById('login');
    const logoutBtn = document.getElementById('logout');
    const actions = document.getElementById('actions');
    const createBtn = document.getElementById('create');
    const deleteBtn = document.getElementById('delete');

    function renderAuthState() {
      const token = localStorage.getItem('access_token');
      if (token) {
        loginBtn.style.display = 'none';
        logoutBtn.style.display = '';
        actions.style.display = '';
      } else {
        loginBtn.style.display = '';
        logoutBtn.style.display = 'none';
        actions.style.display = 'none';
      }
    }

    loginBtn.onclick = () => {
      const apiBase = getApiBaseOrNull();
      if (!apiBase) {
        out.textContent = 'API not configured. Set API_BASE (must be an https://... URL from `terraform output api_base_url`).';
        return;
      }
      window.location.href = `${apiBase}/login`;
    };

    logoutBtn.onclick = () => {
      const apiBase = getApiBaseOrNull();
      if (!apiBase) {
        out.textContent = 'API not configured. Set API_BASE (must be an https://... URL from `terraform output api_base_url`).';
        return;
      }
      // Clear local token then redirect to Hosted UI logout via API
      localStorage.removeItem('access_token');
      window.location.href = `${apiBase}/logout`;
    };

    createBtn.onclick = async () => {
      out.textContent = 'Submitting create request...';
      try {
        const { status, data } = await api('/create-ec2', { method: 'POST', body: JSON.stringify({}) });
        if (status !== 202 || !data.request_id) {
          out.textContent = 'HTTP status: ' + status + '\n' + JSON.stringify(data, null, 2);
          return;
        }

        const requestId = data.request_id;
        out.textContent = 'Request accepted. request_id=' + requestId + '\nPolling status...';

        const maxAttempts = 60; // ~2 minutes
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          await new Promise(r => setTimeout(r, 2000));
          const resp = await api(`/requests/${requestId}`, { method: 'GET' });
          const st = resp.data && resp.data.status;
          if (st === 'SUCCEEDED') {
            out.textContent = 'SUCCEEDED\n' + JSON.stringify(resp.data, null, 2);
            return;
          }
          if (st === 'FAILED') {
            out.textContent = 'FAILED\n' + JSON.stringify(resp.data, null, 2);
            return;
          }
          out.textContent = `Polling status... (${attempt}/${maxAttempts})\n` + JSON.stringify(resp.data, null, 2);
        }

        out.textContent = 'Timed out waiting for completion. You can retry polling: GET /requests/' + requestId;
      } catch (e) {
        out.textContent = 'Error: ' + e;
      }
    };
    deleteBtn.onclick = async () => {
      out.textContent = 'Submitting delete request...';
      try {
        const { status, data } = await api('/instances', { method: 'DELETE' });
        if (status !== 202 || !data.request_id) {
          out.textContent = 'HTTP status: ' + status + '\n' + JSON.stringify(data, null, 2);
          return;
        }

        const requestId = data.request_id;
        out.textContent = 'Request accepted. request_id=' + requestId + '\nPolling status...';

        const maxAttempts = 60; // ~2 minutes
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          await new Promise(r => setTimeout(r, 2000));
          const resp = await api(`/requests/${requestId}`, { method: 'GET' });
          const st = resp.data && resp.data.status;
          if (st === 'SUCCEEDED') {
            out.textContent = 'SUCCEEDED\n' + JSON.stringify(resp.data, null, 2);
            return;
          }
          if (st === 'FAILED') {
            out.textContent = 'FAILED\n' + JSON.stringify(resp.data, null, 2);
            return;
          }
          out.textContent = `Polling status... (${attempt}/${maxAttempts})\n` + JSON.stringify(resp.data, null, 2);
        }

        out.textContent = 'Timed out waiting for completion. You can retry polling: GET /requests/' + requestId;
      } catch (e) {
        out.textContent = 'Error: ' + e;
      }
    };

    // On load, capture token and update UI
    parseTokenFromHash();
    renderAuthState();
    // No list endpoint; you can paste the Instance ID to delete.
    </script>
  </body>
  </html>
